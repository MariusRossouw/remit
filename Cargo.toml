[package]
name = "remit-lang"
version = "0.0.1"
edition = "2021"
description = "Checker for the Remit contract language"
license = "Apache-2.0"
repository = "https://github.com/MariusRossouw/remit"

[lib]
name = "remit"
path = "src/lib.rs"

[[bin]]
name = "remit"
path = "src/main.rs"

# No dependencies, on purpose. The checker is part of what must be trusted.
[dependencies]
